[package]
name = "undertone-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace]
resolver = "2"

[features]
default = ["native"]
native = ["dep:gpui", "dep:wry", "dep:raw-window-handle", "dep:windows"]

[dependencies]
anyhow = "=1.0.100"
async-channel = "=2.5.0"
futures-util = { version = "=0.3.31", features = ["sink"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
url = "=2.5.7"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "=1.48.0", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"], optional = true }
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = { version = "=0.6.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"], optional = true }

[[bin]]
name = "undertone-desktop"
path = "src/main.rs"
required-features = ["native"]

[[test]]
name = "bridge"
path = "tests/unit/bridge.rs"

[[test]]
name = "connection"
path = "tests/unit/connection.rs"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
