<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com; connect-src https://www.youtube.com; img-src https://i.ytimg.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
	<style>
		html,body,#player,#player>div{margin:0;width:100%;height:100%;overflow:hidden;background:#1b1917;color:#f7f0e6;font-family:"Segoe UI Variable","Segoe UI",sans-serif}
		iframe{border:0;width:100%;height:100%;border-radius:12px}
		#activate-playback{position:fixed;inset:auto 12px 12px;width:calc(100% - 24px);box-sizing:border-box;padding:12px 16px;border:1px solid #ffbe3d;border-radius:12px;background:#ffbe3d;color:#271b07;font:600 13px "Segoe UI Variable","Segoe UI",sans-serif;box-shadow:0 4px 16px #100f0e;cursor:pointer}
		#activate-playback:hover{background:#ffcf70}
		#activate-playback:focus-visible{outline:2px solid #f7f0e6;outline-offset:2px}
		#activate-playback[hidden]{display:none}
	</style>
</head>
<body><div id="player"></div><script src="/player.js"></script></body>
</html>
